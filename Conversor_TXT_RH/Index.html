<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60"> <!-- Refresh a cada 60 segundos -->
    <title>Excel para TXT - Triel-HT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container-wrapper">
        <!-- Imagem acima do quadrado -->
        <img src="https://www.trielht.com.br/wp-content/uploads/2024/11/logo.png" alt="Logo Triel-HT" class="logo-image">

        <div class="container">
            <h1>Excel para TXT - Triel-HT</h1>
            <label for="excel-file">Selecionar o arquivo de Excel:</label>
            <input type="file" id="excel-file" accept=".xls, .xlsx">
            
            <!-- Botão de conversão original -->
            <button onclick="convertFile()">Converter para Mores</button>
            
            <!-- Botão que agora chama convertFile2 -->
            <button onclick="convertFile2()">Conversar para System</button>

            <div id="message" class="message"></div>

            <!-- Botões para baixar os arquivos MODELO e INSTRUÇÃO DE USO -->
            <div class="download-buttons">
                <a href="MODELO.xlsx" download>
                    <button class="download-btn">Baixar MODELO</button>
                </a>
                <a href="INSTRUÇÕES DE USO.txt" download>
                    <button class="download-btn">Baixar INSTRUÇÃO DE USO</button>
                </a>
            </div>
        </div>

        <!-- Texto abaixo do quadrado -->
        <div class="footer-text">
            <p>Desenvolvido por Pedro Ril - TI Triel-HT</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
